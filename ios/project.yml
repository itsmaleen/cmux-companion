name: cmux
options:
  bundleIdPrefix: dev.itsmaleen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Pinned to 1.18.0 rather than the newest tag (1.20.0): 1.19.0 added
    # SwiftTermBuildInfoPlugin, a build-tool plugin with an executable
    # dependency that this project's fixed `xcodebuild -sdk
    # iphonesimulator... build` invocation cannot satisfy — SPM builds the
    # plugin's host tool under the simulator platform's build directory
    # (`Debug-iphonesimulator/`) instead of `Debug/`, so the plugin's own
    # invocation of it fails with "Build input file cannot be found". 1.18.0
    # predates the plugin and has every API this app uses.
    exactVersion: 1.18.0

targets:
  cmux:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - cmux
    dependencies:
      - package: SwiftTerm
    info:
      path: cmux/Info.plist
      properties:
        CFBundleDisplayName: merry
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - cmux-bridge
            CFBundleURLName: dev.itsmaleen.cmux-bridge
        NSCameraUsageDescription: "Used to scan the pairing QR code shown by the bridge on your Mac."
        NSLocalNetworkUsageDescription: "Used to discover and connect to the bridge running on your Mac over the local network."
        NSBonjourServices:
          - _cmux-bridge._tcp
        NSMicrophoneUsageDescription: "Used for voice input to send text to your terminal sessions."
        NSSpeechRecognitionUsageDescription: "Used to transcribe your voice and send it as text."
        UILaunchScreen: {}
        # Portrait is the normal orientation; landscape is only ever reached
        # via the screenshot fixture's explicit geometry-update request (see
        # cmuxApp.swift) — declared here so that request isn't refused.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.itsmaleen.cmux
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
